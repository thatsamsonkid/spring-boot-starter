name: Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  formatter-and-linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Check formatting
        run: ./mvnw -B spotless:check
      - name: Run Checkstyle
        run: ./mvnw -B checkstyle:check
